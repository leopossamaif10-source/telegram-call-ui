<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Chamada · Telegram</title>
<style>
  :root{
    --bg:#0e1621;
    --bg-2:#17212b;
    --bg-3:#1f2c39;
    --line:#222e3c;
    --text:#ffffff;
    --muted:#7d8e9e;
    --green:#3ec46d;
    --green-2:#2aa85a;
    --red:#e44b4b;
    --red-2:#c93b3b;
    --blue:#5eb5f7;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
  body{
    min-height:100vh;
    background:
      radial-gradient(1200px 600px at 20% -10%, #1a2a3a 0%, transparent 60%),
      radial-gradient(900px 500px at 100% 110%, #16344a 0%, transparent 60%),
      #06090d;
    display:flex;align-items:center;justify-content:center;padding:20px;
  }

  /* Phone frame */
  .phone{
    width:min(420px, 100%);
    height:min(820px, calc(100vh - 40px));
    background:var(--bg);
    border-radius:38px;
    overflow:hidden;
    position:relative;
    box-shadow:
      0 0 0 1px #000,
      0 0 0 10px #0b0d10,
      0 0 0 11px #1a1f25,
      0 40px 80px rgba(0,0,0,.6),
      0 0 120px rgba(62,196,109,.06);
    display:flex;flex-direction:column;
  }
  .notch{
    position:absolute;top:10px;left:50%;transform:translateX(-50%);
    width:120px;height:28px;background:#000;border-radius:20px;z-index:30;
  }

  /* Top bar */
  .topbar{
    height:54px;padding:0 14px;display:flex;align-items:center;gap:10px;
    background:linear-gradient(180deg,#17212b 0%, #17212b 100%);
    border-bottom:1px solid #0a0f15;
    z-index:5;position:relative;
  }
  .topbar .back{color:#6ab3f3;font-size:15px;display:flex;align-items:center;gap:4px;cursor:pointer;opacity:.9}
  .topbar .title{flex:1;text-align:center;font-weight:600;font-size:16px;letter-spacing:.2px}
  .topbar .menu{width:24px;height:24px;display:flex;flex-direction:column;justify-content:center;gap:3px;align-items:center;opacity:.6}
  .topbar .menu span{width:3px;height:3px;border-radius:50%;background:#fff}

  .stage{flex:1;position:relative;overflow:hidden}

  /* Screens */
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .45s ease, transform .45s ease}
  .screen.active{opacity:1;transform:none;pointer-events:auto}

  /* Incoming */
  .avatar-wrap{position:relative;width:148px;height:148px;display:flex;align-items:center;justify-content:center;margin-top:30px}
  .pulse{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(62,196,109,.35);animation:pulse 2.2s ease-out infinite}
  .pulse:nth-child(2){animation-delay:.7s}
  .pulse:nth-child(3){animation-delay:1.4s}
  @keyframes pulse{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.5);opacity:0}}
  .avatar{
    width:120px;height:120px;border-radius:50%;
    background:linear-gradient(135deg,#3ec46d,#1e8a4a);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 10px 40px rgba(62,196,109,.35), inset 0 0 0 2px rgba(255,255,255,.08);
    position:relative;z-index:2;
  }
  .avatar svg{width:60px;height:60px;color:#fff}
  .name{margin-top:28px;font-size:24px;font-weight:600}
  .status{margin-top:8px;color:var(--muted);font-size:15px;display:flex;align-items:center;gap:6px}
  .status .dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:blink 1.2s infinite}
  @keyframes blink{50%{opacity:.3}}
  .guest{margin-top:6px;color:#54667a;font-size:13px}

  .incoming-actions{position:absolute;bottom:42px;left:0;right:0;display:flex;justify-content:space-around;padding:0 40px}
  .call-btn{
    width:68px;height:68px;border-radius:50%;border:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;color:#fff;
    transition:transform .15s ease, box-shadow .25s ease, filter .2s ease;
    position:relative;
  }
  .call-btn svg{width:30px;height:30px}
  .call-btn.decline{background:linear-gradient(180deg,#e44b4b,#b93232);box-shadow:0 10px 24px rgba(228,75,75,.4)}
  .call-btn.accept{background:linear-gradient(180deg,#3ec46d,#23934e);box-shadow:0 10px 24px rgba(62,196,109,.45)}
  .call-btn.accept::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(62,196,109,.45);animation:ring 1.8s ease-out infinite}
  @keyframes ring{0%{transform:scale(.85);opacity:1}100%{transform:scale(1.3);opacity:0}}
  .call-btn:active{transform:scale(.92)}
  .call-btn.decline svg{transform:rotate(135deg)}
  .btn-label{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--muted);white-space:nowrap}

  /* Connecting */
  .loader{width:72px;height:72px;position:relative}
  .loader svg{width:100%;height:100%;animation:spin 1.6s linear infinite}
  .loader circle{fill:none;stroke:var(--green);stroke-width:4;stroke-linecap:round;stroke-dasharray:180;stroke-dashoffset:60;filter:drop-shadow(0 0 6px rgba(62,196,109,.6))}
  @keyframes spin{to{transform:rotate(360deg)}}
  .badge{margin-top:24px;background:rgba(62,196,109,.12);color:var(--green);border:1px solid rgba(62,196,109,.3);padding:6px 12px;border-radius:999px;font-size:12px;display:inline-flex;align-items:center;gap:6px}
  .badge svg{width:14px;height:14px}

  /* Call */
  #call{padding:0;background:#000}
  #call.active{display:flex}
  .video-bg{position:absolute;inset:0;background:#000;overflow:hidden}
  .video-bg video{width:100%;height:100%;object-fit:cover}
  .call-grad{position:absolute;inset:0;background:linear-gradient(180deg, rgba(0,0,0,.55) 0%, transparent 18%, transparent 70%, rgba(0,0,0,.75) 100%);pointer-events:none}
  .timer{position:absolute;top:14px;left:14px;background:rgba(0,0,0,.45);backdrop-filter:blur(10px);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px}
  .timer .rec{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:blink 1.4s infinite}
  .self-cam{
    position:absolute;top:14px;right:14px;width:96px;height:140px;border-radius:14px;overflow:hidden;
    background:linear-gradient(135deg,#1f2c39,#0e1621);
    box-shadow:0 8px 24px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.08);
    display:flex;align-items:center;justify-content:center;
  }
  .self-cam .me{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#5eb5f7,#2b6fb1);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px}
  .self-cam::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(0,0,0,.5));pointer-events:none}

  .controls{
    position:absolute;left:0;right:0;bottom:22px;display:flex;justify-content:center;gap:14px;padding:0 14px;
  }
  .ctrl{
    width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.12);backdrop-filter:blur(14px);
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;border:1px solid rgba(255,255,255,.08);
    transition:transform .15s, background .2s;
  }
  .ctrl:hover{background:rgba(255,255,255,.18)}
  .ctrl:active{transform:scale(.92)}
  .ctrl.off{background:#fff;color:#000}
  .ctrl svg{width:22px;height:22px}
  .ctrl.end{background:linear-gradient(180deg,#e44b4b,#b93232);box-shadow:0 8px 24px rgba(228,75,75,.45)}
  .ctrl.end svg{transform:rotate(135deg)}

  /* shake */
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-1px)}75%{transform:translateX(1px)}}
  .shake{animation:shake .15s ease-in-out 2}

  /* Ended */
  .ended-msg{color:var(--muted);font-size:14px;margin-top:14px}

  /* Self cam video */
  .self-cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);background:#000;display:none}
  .self-cam.live video{display:block}
  .self-cam.live .me{display:none}

  /* Mic muted */
  .ctrl.muted{background:linear-gradient(180deg,#e44b4b,#b93232);color:#fff;border-color:rgba(255,255,255,.15)}
  .ctrl.muted::after{content:"";position:absolute;width:30px;height:2px;background:#fff;border-radius:2px;transform:rotate(-45deg);box-shadow:0 0 0 1px rgba(0,0,0,.4)}
  .ctrl{position:relative;overflow:hidden}

  /* Speaker active */
  .ctrl.speaker-on{background:#fff;color:#0e1621;box-shadow:0 0 18px rgba(255,255,255,.35)}

  /* Chat panel */
  .chat-overlay{position:absolute;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .3s ease;z-index:20}
  .chat-overlay.open{opacity:1;pointer-events:auto}
  .chat-panel{
    position:absolute;left:0;right:0;bottom:0;height:75%;background:#17212b;
    border-radius:20px 20px 0 0;transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);
    z-index:21;display:flex;flex-direction:column;box-shadow:0 -10px 30px rgba(0,0,0,.5);
  }
  .chat-panel.open{transform:translateY(0)}
  .chat-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #0a0f15;font-weight:600;font-size:15px}
  .chat-close{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;font-size:18px;line-height:1;border:none}
  .chat-grab{width:36px;height:4px;background:rgba(255,255,255,.2);border-radius:4px;margin:8px auto 0}
  .chat-msgs{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:8px}
  .msg{max-width:75%;padding:8px 12px;border-radius:14px;font-size:14px;line-height:1.3;word-wrap:break-word}
  .msg.in{background:#1e2d3d;align-self:flex-start;border-bottom-left-radius:4px}
  .msg.out{background:#43a047;align-self:flex-end;border-bottom-right-radius:4px;color:#fff}
  .chat-input{display:flex;gap:8px;padding:10px 12px;border-top:1px solid #0a0f15;background:#17212b}
  .chat-input input{flex:1;background:#0e1621;border:1px solid #222e3c;border-radius:18px;padding:9px 14px;color:#fff;font-size:14px;outline:none}
  .chat-input input:focus{border-color:#3ec46d}
  .chat-send{background:#3ec46d;border:none;width:38px;height:38px;border-radius:50%;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center}
  .chat-send svg{width:18px;height:18px}

  @media (max-height:700px){
    .phone{height:calc(100vh - 20px);border-radius:24px}
    .avatar-wrap{margin-top:10px;width:120px;height:120px}
    .avatar{width:100px;height:100px}
    .avatar svg{width:50px;height:50px}
  }
</style>
</head>
<body>
  <div class="phone" id="phone">
    <div class="notch"></div>
    <div class="topbar">
      <div class="back">‹ Voltar</div>
      <div class="title">chamada</div>
      <div class="menu"><span></span><span></span><span></span></div>
    </div>

    <div class="stage">
      <!-- Incoming -->
      <section class="screen active" id="incoming">
        <div class="avatar-wrap">
          <div class="pulse"></div><div class="pulse"></div><div class="pulse"></div>
          <div class="avatar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/>
            </svg>
          </div>
        </div>
        <div class="name">Chamada de Vídeo</div>
        <div class="status"><span class="dot"></span> Chamada entrando...</div>
        <div class="guest">Entrando como Convidado</div>

        <div class="incoming-actions">
          <div style="position:relative">
            <button class="call-btn decline" id="declineBtn" aria-label="Recusar">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.13.96.36 1.9.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0122 16.92z"/></svg>
            </button>
            <div class="btn-label">Recusar</div>
          </div>
          <div style="position:relative">
            <button class="call-btn accept" id="acceptBtn" aria-label="Atender">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.13.96.36 1.9.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0122 16.92z"/></svg>
            </button>
            <div class="btn-label">Atender</div>
          </div>
        </div>
      </section>

      <!-- Connecting -->
      <section class="screen" id="connecting">
        <div class="loader">
          <svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="26"></circle></svg>
        </div>
        <div class="name" style="margin-top:30px;font-size:20px">Estabelecendo conexão</div>
        <div class="status"><span class="dot"></span> Conectando...</div>
        <div class="badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
          Chamada criptografada
        </div>
      </section>

      <!-- Call -->
      <section class="screen" id="call">
        <div class="video-bg">
          <video id="remoteVideo" autoplay loop muted playsinline></video>
        </div>
        <div class="call-grad"></div>

        <div class="timer"><span class="rec"></span><span id="timer">00:00</span></div>
        <div class="self-cam" id="selfCam"><video id="selfVideo" autoplay playsinline muted></video><div class="me">EU</div></div>

        <div class="controls">
          <div class="ctrl" id="micBtn" title="Microfone">
            <svg id="micOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
          </div>
          <div class="ctrl" id="camBtn" title="Câmera">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
          </div>
          <div class="ctrl" id="audioBtn" title="Áudio">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/></svg>
          </div>
          <div class="ctrl" id="chatBtn" title="Chat">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
          </div>
          <div class="ctrl end" id="endBtn" title="Desligar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.13.96.36 1.9.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0122 16.92z"/></svg>
          </div>
        </div>

        <div class="chat-overlay" id="chatOverlay"></div>
        <div class="chat-panel" id="chatPanel">
          <div class="chat-grab"></div>
          <div class="chat-header">
            <span>Chat da chamada</span>
            <button class="chat-close" id="chatClose" aria-label="Fechar">×</button>
          </div>
          <div class="chat-msgs" id="chatMsgs">
            <div class="msg in">Olá! 👋</div>
            <div class="msg in">Pode me ouvir?</div>
          </div>
          <form class="chat-input" id="chatForm" autocomplete="off">
            <input id="chatInput" type="text" placeholder="Mensagem" />
            <button class="chat-send" type="submit" aria-label="Enviar">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
          </form>
        </div>
      </section>

      <!-- Ended -->
      <section class="screen" id="ended">
        <div class="avatar" style="background:linear-gradient(135deg,#444,#222)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:50px;height:50px;transform:rotate(135deg)"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.13.96.36 1.9.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0122 16.92z"/></svg>
        </div>
        <div class="name" style="margin-top:24px">Chamada encerrada</div>
        <div class="ended-msg" id="endedDuration">Duração: 00:00</div>
        <button id="restartBtn" style="margin-top:24px;background:rgba(62,196,109,.15);color:var(--green);border:1px solid rgba(62,196,109,.35);padding:10px 22px;border-radius:999px;cursor:pointer;font-size:14px">Reiniciar</button>
      </section>
    </div>
  </div>

<script>
(() => {
  const screens = {
    incoming: document.getElementById('incoming'),
    connecting: document.getElementById('connecting'),
    call: document.getElementById('call'),
    ended: document.getElementById('ended'),
  };
  const show = (key) => {
    Object.values(screens).forEach(s => s.classList.remove('active'));
    screens[key].classList.add('active');
  };

  // Ringtone via WebAudio
  let audioCtx, ringInterval, ringActive = false;
  function playRingtone(){
    try{
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      ringActive = true;
      const tone = () => {
        if(!ringActive) return;
        const t = audioCtx.currentTime;
        [0, .4].forEach(off => {
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.type = 'sine';
          o.frequency.setValueAtTime(520, t+off);
          o.frequency.setValueAtTime(660, t+off+.18);
          g.gain.setValueAtTime(0, t+off);
          g.gain.linearRampToValueAtTime(.08, t+off+.02);
          g.gain.linearRampToValueAtTime(0, t+off+.35);
          o.connect(g).connect(audioCtx.destination);
          o.start(t+off); o.stop(t+off+.4);
        });
      };
      tone();
      ringInterval = setInterval(tone, 2200);
    }catch(e){}
  }
  function stopRingtone(){ ringActive=false; clearInterval(ringInterval); }

  function beep(freq=440,dur=.12){
    try{
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type='sine'; o.frequency.value=freq;
      g.gain.setValueAtTime(0,audioCtx.currentTime);
      g.gain.linearRampToValueAtTime(.12,audioCtx.currentTime+.01);
      g.gain.linearRampToValueAtTime(0,audioCtx.currentTime+dur);
      o.connect(g).connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime+dur);
    }catch(e){}
  }

  // Vibration shake
  const phone = document.getElementById('phone');
  let shakeInt;
  function startShake(){
    shakeInt = setInterval(()=>{ phone.classList.add('shake'); setTimeout(()=>phone.classList.remove('shake'),300); }, 2200);
  }
  function stopShake(){ clearInterval(shakeInt); phone.classList.remove('shake'); }

  // Auto-start ringtone on first interaction (browser policy)
  const tryStartRing = () => { playRingtone(); startShake(); document.removeEventListener('click', tryStartRing); document.removeEventListener('touchstart', tryStartRing); };
  document.addEventListener('click', tryStartRing, {once:true});
  document.addEventListener('touchstart', tryStartRing, {once:true});
  startShake();

  // Timer
  let timerInt, seconds=0;
  const timerEl = document.getElementById('timer');
  function fmt(s){ const m=String(Math.floor(s/60)).padStart(2,'0'); const ss=String(s%60).padStart(2,'0'); return m+':'+ss; }
  function startTimer(){ seconds=0; timerEl.textContent='00:00'; timerInt=setInterval(()=>{ seconds++; timerEl.textContent=fmt(seconds); },1000); }
  function stopTimer(){ clearInterval(timerInt); }

  // Buttons
  document.getElementById('acceptBtn').addEventListener('click', () => {
    beep(660,.15);
    stopRingtone(); stopShake();
    show('connecting');
    setTimeout(()=>{
      beep(520,.1);
      setTimeout(()=>{
        show('call');
        startTimer();
        const v = document.getElementById('remoteVideo');
        // Try to play (will work if a source is provided)
        v.play().catch(()=>{});
      }, 300);
    }, 5000);
  });

  document.getElementById('declineBtn').addEventListener('click', () => {
    beep(220,.2);
    stopRingtone(); stopShake();
    document.getElementById('endedDuration').textContent = 'Chamada recusada';
    show('ended');
  });

  document.getElementById('endBtn').addEventListener('click', () => {
    beep(220,.2);
    stopTimer();
    document.getElementById('endedDuration').textContent = 'Duração: '+fmt(seconds);
    show('ended');
  });

  // Toggle controls
  ['micBtn','camBtn','audioBtn','chatBtn'].forEach(id=>{
    document.getElementById(id).addEventListener('click', e => {
      e.currentTarget.classList.toggle('off');
      beep(700,.05);
    });
  });

  document.getElementById('restartBtn').addEventListener('click', () => {
    seconds=0; show('incoming'); playRingtone(); startShake();
  });

  // Video source (optional) — supports ?video=URL
  const params = new URLSearchParams(location.search);
  const videoSrc = params.get('video');
  if(videoSrc){
    const v = document.getElementById('remoteVideo');
    v.src = videoSrc;
  }
})();
</script>
</body>
</html>
